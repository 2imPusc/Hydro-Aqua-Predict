name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # data/ is not in git: tests marked requires_data are skipped automatically.
      - run: python -m pytest -q
      - run: python scripts/check_isolation.py

  research-map-backend:
    name: research-map backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-map/backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research-map/backend-fastapi/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: .

  research-map-frontend:
    name: research-map frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-map/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: research-map/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
